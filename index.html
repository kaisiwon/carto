<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashfield 2131 Community Map</title>
    
    <!-- Leaflet CSS for Map Styling -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ashfield 2131 Community Map</h1>
        <p>Find essential public facilities and services easily.</p>
        <input type="text" id="search-bar" placeholder="🔍 Search facilities...">
        <button id="locate-btn">📍 Find My Location</button>
    </header>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Leaflet JS & Custom Script -->

     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
